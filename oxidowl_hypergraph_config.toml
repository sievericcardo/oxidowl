# Oxidowl Configuration - Force Hypergraph Tableau Usage
# This configuration ensures oxidowl uses hypertableau algorithm instead of standard tableau
#
# Hypergraphs provide more efficient reasoning for certain OWL 2 DL patterns
# and can improve performance for complex ontologies with many disjunctions,
# existential restrictions, and number restrictions.

[server]
# Enabled server features (bitflags): Server=1, Cors=2, OWLlink=4, SPARQL=8, RestAPI=16
# 0 = no server features enabled
features = 0
port = 8080
bind_address = "127.0.0.1"
max_connections = 100
request_timeout = { secs = 300, nanos = 0 }
max_request_size = 10485760
owllink_port = 8081
sparql_port = 8082
rest_api_port = 8083

[reasoning]
# Force use of hypertableau algorithm
# Options: Traditional, Hypertableau, ProfileOptimised
tableau_algorithm = "Hypertableau"

# Blocking strategy for the tableau algorithm
# Options: Anywhere, Ancestor, Pairwise, Dynamic, Single, Core, Optimal, Indexed
blocking_strategy = "Optimal"

# Expansion strategy for the tableau
# Options: CreationOrder, IndividualReuse, Priority, EL, Optimal
expansion_strategy = "Optimal"

# Enabled reasoning features (bitflags): Optimizations=1, Explanations=2, ClashDetection=4, BlockersCache=8
# 13 = Optimizations + ClashDetection + BlockersCache (1 + 4 + 8)
features = 13

# Maximum response time for reasoning tasks (optional)
# timeout = { secs = 300, nanos = 0 }

# Maximum memory usage in MB for the reasoner (optional)
# max_memory_mb = 4096

# Enable incremental reasoning
incremental_reasoning = true

# Maximum tableau expansion depth
max_expansion_depth = 1000

# Ignore unsupported datatypes
ignore_unsupported_datatypes = false

# Dump DL clauses for debugging
dump_clauses = false

# Clause dump file path (optional)
# clause_dump_file = "/tmp/clauses.txt"

# Target OWL profile for optimization
# Options: DL, EL, QL, RL, Auto
target_profile = "DL"

[cache]
# Enabled cache features (bitflags): Satisfiability=1, CompletionGraph=2, Unsatisfiability=4
# 7 = Satisfiability + CompletionGraph + Unsatisfiability (1 + 2 + 4)
features = 7

# Maximum size of the cache in MB
max_cache_size_mb = 1024

# Time to live for cache entries (optional)
# cache_ttl = { secs = 3600, nanos = 0 }

# Cache eviction strategy
# Options: LRU, LFU, TimeToLive, Random
eviction_strategy = "LRU"

# Cache persistence settings
persistence = false

[logging]
# Logging level
# Options: Debug, Info, Warning, Error, Trace
level = "Info"

# Enable or disable file logging
enable_file_logging = false

# Path to the log file (optional)
# log_file_path = "/var/log/oxidowl.log"

# Log rotation settings in MB
log_rotation_size_mb = 100

# Maximum number of log files to keep
max_log_files = 10

[performance]
# Performance profile (Low/Medium/High/Ultra)
# Options: Low, Medium, High, Ultra
profile = "High"

# Number of threads for parallel reasoning (optional, overrides profile default)
# worker_threads = 8

# Enabled performance features (bitflags): ParallelExpansion=1, SIMD=2, NumaAwareness=4, LockFree=8, PersistentCollections=16
# 27 = ParallelExpansion + SIMD + LockFree + PersistentCollections (1 + 2 + 8 + 16)
features = 27

# Memory pool in MB
memory_pool_size_mb = 2048

# Garbage collection threshold (0.0 - 1.0)
gc_threshold = 0.75

# Maximum classification parallelism (optional, concurrent subsumption tests)
max_parallel_classification_tasks = 1024
