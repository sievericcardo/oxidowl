# Release pipeline for Oxidowl.
#
# Triggers:
#   - push of a v* tag (the normal release path)
#   - workflow_dispatch with an optional `tag` input (manual/re-run path)
#
# Jobs:
#   meta      – resolve the release tag (push ref or dispatch input)
#   build     – native release binaries for 4 targets (no cross-compilation)
#   release   – create the GitHub Release and attach binaries + checksums
#   docker    – build the linux/amd64 image to validate the Dockerfile on
#               every release; the image is NEVER pushed. Publishing is a
#               manual owner action (docker build/push locally, or a
#               one-off re-enable of a login+push step).
#
# Secrets: only the default GITHUB_TOKEN (contents: write). No PAT is
# required and no registry auth is needed — nothing is pushed to ghcr.io.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.0.1). Defaults to the pushed tag when run from a tag ref."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves the tag once so every downstream job agrees on the name.
  # - On a tag push the input is empty and github.ref_name is the tag.
  # - On workflow_dispatch the input wins; falling back to the ref when the
  #   workflow was dispatched on a tag ref. Missing input on a branch ref is
  #   a hard error with a clear message (never silently releases "main").
  meta:
    name: resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided. Push a v* tag or pass the 'tag' input via workflow_dispatch."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

  build:
    name: build (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macos-13 (the previous x86_64 label) was retired on 2025-12-04;
          # macos-15-intel is GitHub's replacement Intel runner (supported
          # until August 2027). Do NOT switch back to macos-13 — a retired
          # macOS label fails/cancels immediately at queue time with
          # `The configuration '...' is not supported`, so the job never runs.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # macos-14 (the previous arm64 label) was retired on 2026-11-02 —
          # GitHub retired ALL macOS 14 runner images (actions/runner-images
          # issues #13518 and #15226; GitHub changelog 2026-10-01 "macOS 14
          # runner image retirement"). Jobs on `macos-14` are cancelled at
          # queue time with `The configuration 'macos-14-arm64-us-default' is
          # not supported`. `macos-15` is the documented arm64 migration
          # target (explicit pin; sibling of `macos-15-intel`). Do NOT use
          # `macos-latest` — it moved to macOS 26 in mid-2026 and would
          # drift — and do NOT reintroduce `macos-14`.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        # Xcode/clang CLT are preinstalled; only CMake is required for RocksDB.
        run: brew install cmake

      # VS Build Tools (MSVC) and CMake are preinstalled on windows-latest.

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        # `server` enables the OWLlink/SPARQL/REST HTTP servers (warp);
        # `sparql` enables the SPARQL endpoint module. Default features stay
        # on (they pull in Oxigraph/RocksDB via `sparql-store`).
        # The target is interpolated by Actions BEFORE the shell runs, so this
        # step is shell-agnostic. Do NOT pass `"$TARGET"` instead: this step
        # also runs on windows-latest, whose default shell is pwsh, where an
        # unset `$TARGET` expands to an empty string and cargo fails with
        # `error: target was empty`.
        run: cargo build --release --locked --features server,sparql --target ${{ matrix.target }} --bin oxidowl

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="oxidowl-${TAG}-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp "target/${TARGET}/release/oxidowl" "dist/${STAGE}/oxidowl"
          cp README.md LICENSE "dist/${STAGE}/"
          tar -czf "dist/${STAGE}.tar.gz" -C dist "${STAGE}"
          rm -rf "dist/${STAGE}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "oxidowl-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/$env:TARGET/release/oxidowl.exe" "dist/$stage/oxidowl.exe"
          Copy-Item README.md, LICENSE -Destination "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip" -Force
          Remove-Item -Recurse -Force "dist/$stage"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Set-Content -Path "dist/$stage.zip.sha256" -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: oxidowl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: artifacts/**
          generate_release_notes: true

  # Builds the linux/amd64 image on every release purely to validate that
  # the Dockerfile still builds. The image is NEVER pushed to ghcr.io:
  # publishing is a manual owner action (docker build/push from a local
  # machine, or a one-off re-enable of a docker/login-action step together
  # with `push: true`). metadata-action is kept so the computed tags/labels
  # stay visible in the CI log and are reusable if an owner later re-enables
  # a login+push step manually.
  docker:
    name: docker (build only)
    # Intentionally also needs `build`: a Dockerfile/feature-set regression
    # must not silently pass while the native release builds are red.
    # Do NOT "optimise" this down to `needs: [meta]`.
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sievericcardo/oxidowl
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            # Fallback for workflow_dispatch runs (ref is a branch there).
            type=raw,value=${{ needs.meta.outputs.tag }},enable=${{ github.ref_type != 'tag' }}
            # `latest` only for tag builds, never on manual branch dispatches.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build (never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # linux/amd64 only: RocksDB is compiled from source (via Oxigraph)
          # and would need QEMU emulation for arm64, which is prohibitively
          # slow for a full release build. Add arm64 later only with a native
          # arm64 runner (e.g. ubuntu-24.04-arm), never via emulation.
          platforms: linux/amd64
          # Build-only policy: validate the Dockerfile, publish nothing.
          # Publishing stays a manual owner action — flip this back to true
          # only together with a re-added docker/login-action step.
          push: false
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  # --- crates.io publishing is intentionally NOT automated ---------------
  # publish-crate:
  #   needs: [meta, release]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
  #
  # Uncomment only when a CARGO_REGISTRY_TOKEN repository secret exists and
  # an accidental `cargo publish` is acceptable — crates.io releases are
  # permanent and cannot be overwritten.
