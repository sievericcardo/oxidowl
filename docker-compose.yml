# Docker Compose for Oxidowl.
#
# Default service runs the CLI (prints help). Uncomment/override `command`
# for your reasoning task, or use the `oxidowl-server` example below to run
# the HTTP servers.
#
# Note: the `version:` top-level key is obsolete in Compose v2 and removed
# here; Compose infers the schema automatically.

services:
  oxidowl:
    build:
      context: .
      dockerfile: Dockerfile
    image: oxidowl:latest
    container_name: oxidowl
    volumes:
      # Mount your local ontologies directory
      - ./ontologies:/ontologies
      # Or mount the entire project (for output files, configs, etc.)
      # - .:/ontologies
    # Override command with your specific reasoning task
    # Examples:
    # command: ["-k", "/ontologies/myontology.owl"]
    # command: ["-c", "-P", "/ontologies/greenhouse.ttl"]
    # command: ["--help"]
    command: ["--help"]

    # No healthcheck on the CLI service: the container exits after running
    # the command. The server example below has one.

    # Optional: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 4G
    #     reservations:
    #       cpus: '1.0'
    #       memory: 2G

  # Example: HTTP server mode (uncomment to use).
  #
  # Flags match the actual CLI (src/bin/main.rs):
  #   --enable-server   start server mode (REST API on --server-port)
  #   --server-bind     listen address (0.0.0.0 inside the container)
  #   --server-port     REST API port (default 8080, also sets rest_api_port)
  #   --enable-sparql   start the SPARQL endpoint
  #   --sparql-port     SPARQL port (default 8082)
  # Optional: --enable-owllink / --owllink-port (default 8081).
  #
  # Health endpoint: GET /api/v1/health on the REST port (src/server/rest.rs).
  # oxidowl-server:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: oxidowl:latest
  #   container_name: oxidowl-server
  #   ports:
  #     - "8080:8080"   # REST API
  #     - "8082:8082"   # SPARQL endpoint
  #   volumes:
  #     - ./ontologies:/ontologies
  #   command:
  #     - "--enable-server"
  #     - "--server-bind"
  #     - "0.0.0.0"
  #     - "--server-port"
  #     - "8080"
  #     - "--enable-sparql"
  #     - "--sparql-port"
  #     - "8082"
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 15s
