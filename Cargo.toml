[package]
name = "oxidowl"
version = "0.2.0"
edition = "2024"
description = "A high-performance Description Logic reasoner using tableau algorithms with parallel computation"
license = "BSD-3-Clause"
repository = "https://github.com/sievericcardo/oxidowl"
keywords = ["description-logic", "reasoner", "tableau", "parallel", "ontology"]
categories = ["algorithms", "concurrency", "science"]

[lib]
name = "oxidowl"
path = "src/lib.rs"

[[bin]]
name = "oxidowl"
path = "src/bin/main.rs"

[[bin]]
name = "run_performance_tests"
path = "src/bin/performance_tests.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.45", features = ["full"] }
futures = "0.3"
rayon = {  version = "1.10", optional = true }
dashmap = { version = "6.1", optional = true }
im = "15.1"  # Immutable data structures
smallvec = "1.15"
ahash = "0.8"
bitflags = "2.9"
itertools = "0.13"
thiserror = "2.0"
anyhow = "1.0"
num_cpus = "1.17"
crossbeam = { version = "0.8", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Logging and tracing
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI (for binary)
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
iso8601-duration = "0.2"
plotters = { version = "0.3", optional = true }
bytes = "1.0"

# Synchronization primitives
parking_lot = "0.12"

# Hash computation and advanced data structures
roaring = "0.11" # Compressed bitmaps for efficient set operations
lru = "0.16"     # LRU cache for blocking candidates

# Performance profiling (optional)
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

# OWL integration and reasoning infrastructure
horned-owl = "1.1.0"  # Core OWL ontology model and parsing
curie = "0.1.4"         # Prefix mapping support for horned-owl
# sophia = { version = "0.8", optional = true }   # May need specific version
rio_api = "0.8"
rio_turtle = "0.8"
rio_xml = "0.8"

# SPARQL and RDF graph support
oxigraph = { version = "0.5.0", features = ["rocksdb"], optional = true }

# String handling and utilities
regex = "1.11"
uuid = { version = "1.17", features = ["v4", "serde"] }
url = { version = "2.3", features = ["serde"] }
lazy_static = "1.4"

# File I/O and path handling
tempfile = "3.5"
walkdir = "2.3"

# Numerical computing
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
ndarray = "0.15"

# Machine Learning - Candle framework
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
rand = "0.8"
bincode = "1.3"

# Configuration management
config = "0.15.13"

# Server interfaces and web support
tokio-tungstenite = { version = "0.28", optional = true }
warp = { version = "0.4.2", optional = true }
quick-xml = { version = "0.31", features = ["serialize"] }

# JSON and XML parsing for ontology formats
roxmltree = "0.20"
toml = "0.9.2"

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.7"
env_logger = "0.11"
tempfile = "3.5"
serial_test = "3.0"

[features]
default = ["parallel", "cache"]
profiling = ["pprof"]
parallel = ["rayon", "crossbeam"]
cache = ["dashmap"]
debug = []
server = ["warp", "tokio-tungstenite"]
sparql = ["oxigraph"]
explanations = []
ml = ["candle-core", "candle-nn"]  # Machine learning features
# owl-integration = ["owlapi", "rdf", "sophia"]  # Disabled until proper deps are available

[[example]]
name = "dl_query_example"
path = "examples/dl_query_example.rs"

[[bench]]
name = "reasoning_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

