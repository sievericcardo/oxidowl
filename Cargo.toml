[package]
name = "oxidowl"
version = "0.7.0"
edition = "2024"
description = "A high-performance Description Logic reasoner using tableau algorithms with parallel computation. This project started as a test to explore the capabilities of agentic LLM tools for software development."
license = "BSD-3-Clause"
repository = "https://github.com/sievericcardo/oxidowl"
keywords = ["description-logic", "reasoner", "tableau", "parallel", "ontology"]
categories = ["algorithms", "concurrency", "science"]

[lib]
name = "oxidowl"
path = "src/lib.rs"

[[bin]]
name = "oxidowl"
path = "src/bin/main.rs"

[[bin]]
name = "performance_tests"
path = "src/bin/performance_tests.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.45", features = ["full"] }
rayon = {  version = "1.10", optional = true }
dashmap = { version = "6.1", optional = true }
# Immutable data structures
thiserror = "2.0"
num_cpus = "1.17"
crossbeam = { version = "0.8", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Logging and tracing
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI (for binary)
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
iso8601-duration = "0.2"

# Hash computation and advanced data structures
# Compressed bitmaps for efficient set operations
lru = "0.16"     # LRU cache for blocking candidates

# Performance profiling (optional)
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

# OWL integration and reasoning infrastructure
horned-owl = "1.1.0"  # Core OWL ontology model and parsing
curie = "0.1.4"         # Prefix mapping support for horned-owl
# sophia = { version = "0.8", optional = true }   # May need specific version

# SPARQL and RDF graph support
oxigraph = { version = "0.5.0", features = ["rocksdb"], optional = true }

# String handling and utilities
regex = "1.11"
uuid = { version = "1.17", features = ["v4", "serde"] }
url = { version = "2.3", features = ["serde"] }
lazy_static = "1.4"

# File I/O and path handling
tempfile = "3.5"

# Machine Learning - Candle framework
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
bincode = "2.0.1"

# Server interfaces and web support
tokio-tungstenite = { version = "0.28", optional = true }
warp = { version = "0.4.2", features = ["server"], optional = true }
bytes = { version = "1.5", optional = true }
futures = { version = "0.3", optional = true }
quick-xml = { version = "0.38.3", features = ["serialize"] }

# JSON and XML parsing for ontology formats
roxmltree = "0.21.1"
toml = "0.9.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_Threading"
] }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
env_logger = "0.11"
tempfile = "3.5"
reqwest = { version = "0.12", features = ["json"] }

[features]
default = ["parallel", "cache"]
profiling = ["pprof"]
parallel = ["rayon", "crossbeam"]
cache = ["dashmap"]
debug = []
server = ["warp", "tokio-tungstenite", "bytes", "futures"]
sparql = ["oxigraph"]
explanations = []
ml = ["candle-core", "candle-nn"]  # Machine learning features
# owl-integration = ["owlapi", "rdf", "sophia"]  # Disabled until proper deps are available

[[example]]
name = "dl_query_example"
path = "examples/dl_query_example.rs"

[[bench]]
name = "reasoning_benchmark"
harness = false

[[bench]]
name = "hypertableau_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

